<style>
/* Layout: one narrow column, one question per screen; summary on the home view, answer feedback in place */
:root {

  --accent: #b42318; --accent-fg: #ffffff; --ok: #157347; --ok-bg: #e6f4ec; --ng: #b42318; --ng-bg: #fbe9e7;
  --soft: #efece8;
  --font-body: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --font-num: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171513; --surface: #211e1b; --fg: #f1ede8; --muted: #a59d95; --line: #3a3531;
  --accent: #ef6a5b; --accent-fg: #1a0d0b; --ok: #5cc98d; --ok-bg: #1d3328; --ng: #ef6a5b; --ng-bg: #3a201c;
  --soft: #2b2724; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171513; --surface: #211e1b; --fg: #f1ede8; --muted: #a59d95; --line: #3a3531;
  --accent: #ef6a5b; --accent-fg: #1a0d0b; --ok: #5cc98d; --ok-bg: #1d3328; --ng: #ef6a5b; --ng-bg: #3a201c;
  --soft: #2b2724; color-scheme: dark; }
/* skin: green（第1種衛生管理者）。赤の配色の上書き。×（不正解）の赤は残す */
:root[data-skin="green"] { --accent: #0b6b4f; --accent-fg: #ffffff; --bg: #f4f7f5; --soft: #e8efeb; --line: #d3ddd7; }
@media (prefers-color-scheme: dark) { :root[data-skin="green"]:not([data-theme="light"]) {
  --accent: #4fc79a; --accent-fg: #07241a; --bg: #121714; --surface: #1b221e; --soft: #252d28; --line: #35403a; } }
:root[data-skin="green"][data-theme="dark"] { --accent: #4fc79a; --accent-fg: #07241a; --bg: #121714; --surface: #1b221e; --soft: #252d28; --line: #35403a; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 34rem; margin: 0 auto; padding-block: 16px 32px; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h1 { font-size: 22px; line-height: 1.35; margin: 0; text-wrap: balance; }
.sign { display: inline-block; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 12px;
  letter-spacing: .12em; padding: 2px 8px; border-radius: 3px; }
.lead { color: var(--muted); margin: 0; font-size: 14px; }
.subjects { display: grid; gap: 10px; }
.subj-wrap { display: grid; gap: 6px; }
.subj-wrap .subj { width: 100%; }
.mini { justify-self: stretch; border: 1px solid var(--accent); color: var(--accent); background: transparent;
  border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 700; }
.subj { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.subj .name { font-weight: 700; }
.subj .meta { font-size: 13px; color: var(--muted); grid-column: 1; }
.subj .rate { grid-row: 1 / span 2; grid-column: 2; font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 20px; font-weight: 700; text-align: right; min-width: 4.5ch; }
.rate small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); font-family: var(--font-body); }
.pass { color: var(--ok); } .fail { color: var(--ng); }
.meter { grid-column: 1 / -1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; position: relative; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.meter b { position: absolute; top: -2px; bottom: -2px; left: 60%; width: 2px; background: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 13rem; border-radius: 12px; padding: 13px 16px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:disabled { opacity: .45; cursor: default; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: 14px; }
.progress { height: 4px; background: var(--soft); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.count { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.tag { font-size: 12px; background: var(--soft); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.question { font-size: 17px; margin: 0; }
.choices { display: grid; gap: 10px; }
.choice { display: grid; grid-template-columns: 2rem 1fr; gap: 6px; text-align: left; align-items: start;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.5; }
.choice .no { font-family: var(--font-num); font-weight: 700; color: var(--muted); }
.choice.correct { border-color: var(--ok); background: var(--ok-bg); }
.choice.correct .no { color: var(--ok); }
.choice.wrong { border-color: var(--ng); background: var(--ng-bg); }
.choice.wrong .no { color: var(--ng); }
.choice[disabled] { cursor: default; }
/* 選択中は正誤の色（緑・赤）と区別するため、文字色の太枠にする */
.choice.selected { border-color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); background: var(--soft); }
.choice.selected .no { color: var(--fg); }
.submit { position: sticky; bottom: 0; padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 30%); }
.submit .btn { width: 100%; }
.feedback { border-radius: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; }
.verdict { font-weight: 700; font-size: 18px; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
.exp { margin: 0; font-size: 15px; }
.result-head { text-align: center; display: grid; gap: 4px; padding-block: 8px; }
.big { font-family: var(--font-num); font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.verdict-line { font-weight: 700; }
.group { font-size: 15px; margin: 8px 0 0; }
input#pass { font: inherit; font-size: 18px; letter-spacing: .08em; text-align: center; padding: 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.err { color: var(--ng); margin: 0; min-height: 1.6em; font-size: 14px; }
.more { display: grid; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.more h2 { font-size: 14px; margin: 8px 0 0; }
.more a { display: block; color: var(--fg); text-decoration: none; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.more a span { display: block; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>

</head><body>

<script>
const INLINE = {"title": "第1種衛生管理者 お試し10問", "kind": "exam", "skin": "green", "rules": {"line": 40, "total": 60, "note": "本番の合格は、範囲ごとに40%以上、かつ合計（配点つき）60%以上です。"}, "subjects": [{"key": "law_h", "name": "関係法令（有害業務に係るもの）", "short": "関係法令（有害）", "questions": 2, "from": 1, "to": 2, "pts": 8}, {"key": "hyg_h", "name": "労働衛生（有害業務に係るもの）", "short": "労働衛生（有害）", "questions": 2, "from": 3, "to": 4, "pts": 8}, {"key": "law_o", "name": "関係法令（有害業務に係るもの以外）", "short": "関係法令（有害以外）", "questions": 2, "from": 5, "to": 6, "pts": 10}, {"key": "hyg_o", "name": "労働衛生（有害業務に係るもの以外）", "short": "労働衛生（有害以外）", "questions": 2, "from": 7, "to": 8, "pts": 10}, {"key": "phys", "name": "労働生理", "short": "労働生理", "questions": 2, "from": 9, "to": 10, "pts": 10}], "questions": [{"question": "有機溶剤中毒予防規則に基づく、局所排気装置の定期自主検査の頻度として、正しいものはどれか。", "choices": ["1年以内ごとに1回", "3年以内ごとに1回", "6か月以内ごとに1回", "1か月以内ごとに1回", "3か月以内ごとに1回"], "answer": 1, "explanation": "局所排気装置やプッシュプル型換気装置は、1年以内ごとに1回、定期自主検査を行い、記録を3年間保存します。", "subject_key": "law_h"}, {"question": "有機溶剤作業主任者に関する次の記述のうち、正しいものはどれか。", "choices": ["有機溶剤作業主任者は、作業環境測定士に限られる。", "有機溶剤作業主任者は、技能講習を修了した者のうちから選任する。", "有機溶剤作業主任者は、特別教育を受ければ、選任できる。", "有機溶剤作業主任者は、選任しなくてもよい。", "有機溶剤作業主任者は、免許を受けた者のうちから選任する。"], "answer": 2, "explanation": "有機溶剤作業主任者は、有機溶剤作業主任者技能講習を修了した者から選任します。免許が必要なのは、高圧室内作業主任者などです。", "subject_key": "law_h"}, {"question": "有機溶剤の蒸気に関する次の記述のうち、正しいものはどれか。", "choices": ["有機溶剤の蒸気は、すぐに拡散して、滞留しない。", "有機溶剤の蒸気は、換気しなくても、害がない。", "有機溶剤の蒸気は、においがあるので、濃度が高くても、安全である。", "有機溶剤の蒸気は、一般に空気より重く、低い場所に滞留しやすい。", "有機溶剤の蒸気は、空気より軽く、天井付近にだけ滞留する。"], "answer": 4, "explanation": "有機溶剤の蒸気は、一般に空気より重く、床付近やピットなどの低い場所にたまりやすい性質があります。", "subject_key": "hyg_h"}, {"question": "局所排気装置のフードに関する次の記述のうち、正しいものはどれか。", "choices": ["フードの開口面は、発散源の反対側に向ける。", "フードは、有害物質の発散源に近づけるほど、効率よく捕捉できる。", "フードは、発散源から遠いほど、効率よく捕捉できる。", "フードの周囲に、障害物があるほど、捕捉しやすい。", "フードの位置は、捕捉効率に関係しない。"], "answer": 2, "explanation": "フードは、発散源にできるだけ近づけ、気流を乱す障害物を避けるほど、少ない排風量で、効率よく捕捉できます。", "subject_key": "hyg_h"}, {"question": "常時150人の労働者を使用する事業場（業種は製造業とする）で、法令上、選任しなければならない衛生管理者の最少人数はどれか。", "choices": ["1人", "2人", "4人", "3人", "0人（選任は不要）"], "answer": 1, "explanation": "衛生管理者は、常時50人以上の事業場で選任します。50人〜200人では1人、201人〜500人では2人です。", "subject_key": "law_o"}, {"question": "雇入れの日から6か月間継続勤務し、全労働日の8割以上出勤した、通常の労働者に対して、労働基準法上、与えなければならない年次有給休暇の日数はどれか。", "choices": ["12日", "10日", "20日", "5日", "8日"], "answer": 2, "explanation": "6か月継続勤務し、全労働日の8割以上出勤した労働者には、10日の年次有給休暇を与えます。以後、勤続年数に応じて増えます。", "subject_key": "law_o"}, {"question": "事務所衛生基準規則に基づく、事務室内の二酸化炭素の含有率の基準として、正しいものはどれか。", "choices": ["100万分の5,000以下", "100万分の10,000以下", "100万分の100以下", "100万分の1,000以下", "100万分の500以下"], "answer": 4, "explanation": "事務室内の二酸化炭素は、100万分の1,000（1,000ppm）以下に保ちます。換気の目安にもなります。", "subject_key": "hyg_o"}, {"question": "熱中症の予防に関する次の記述のうち、正しいものはどれか。", "choices": ["塩分は、とらないほうがよい。", "のどが渇くまで、水分を補給しない。", "こまめに、水分と塩分を補給する。", "熱中症は、屋外でしか起こらない。", "暑い日は、休憩を取らず、作業を続ける。"], "answer": 3, "explanation": "暑い環境では、のどが渇く前に、こまめに水分と塩分を補給します。屋内でも、熱中症は起こります。", "subject_key": "hyg_o"}, {"question": "ガス交換に関する次の記述のうち、正しいものはどれか。", "choices": ["ガス交換は、気管で行われる。", "ガス交換は、行われない。", "ガス交換は、気管支だけで行われる。", "ガス交換は、肺胞で、肺胞内の空気と毛細血管中の血液との間で行われる。", "ガス交換は、鼻腔で行われる。"], "answer": 4, "explanation": "酸素と二酸化炭素の交換（外呼吸）は、肺胞で、肺胞内の空気と、毛細血管中の血液との間で行われます。", "subject_key": "phys"}, {"question": "胆汁に関する次の記述のうち、正しいものはどれか。", "choices": ["胆汁は、蛋白質を分解する酵素を含む。", "胆汁は、肝臓で作られ、脂肪の消化を助ける。", "胆汁は、酸性で、胃酸と同じ働きをする。", "胆汁は、でんぷんを分解する。", "胆汁は、胃で作られる。"], "answer": 2, "explanation": "胆汁は、肝臓で作られ、胆嚢に蓄えられます。消化酵素は含みませんが、脂肪を乳化して、消化を助けます。", "subject_key": "phys"}]};   // 無料お試し：問題を直接入れる。有料ライブラリ：null（合言葉で復号して読み込む）
const LIB = null;       // 有料ライブラリの商品一覧。無料お試しは null
const NUMS = "①②③④⑤";
let DATA, STORE, saved = {}, subjects, qs;
let LIBRARY = false;
function readSaved(key) { try { return JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { return {}; } }
function persist() { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} }
function load(data, storeKey) {
  DATA = data; STORE = storeKey; saved = readSaved(STORE);
  if (DATA.skin) document.documentElement.dataset.skin = DATA.skin; else delete document.documentElement.dataset.skin;
  subjects = DATA.subjects;
  qs = DATA.questions.map((q, i) => ({ ...q, no: i + 1 }));
}
const LINE = () => (DATA.rules && DATA.rules.line) || 60;  // 科目ごとの合格ライン（%）。既定 60
const isBook = () => DATA.kind === "book";  // 分野別問題集：10問ずつのテーマ。60%の合格ラインは出さない

const app = document.getElementById("app");
let run = null; // { list: [question numbers], pos, answered: {no: choice} , label }

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}

function stats(subjKey) {
  const list = qs.filter(q => !subjKey || q.subject_key === subjKey);
  const done = list.filter(q => saved[q.no]);
  const ok = done.filter(q => saved[q.no].ok).length;
  return { total: list.length, done: done.length, ok, rate: done.length ? Math.round(ok / done.length * 100) : null };
}
function wrongNos() { return qs.filter(q => saved[q.no] && !saved[q.no].ok).map(q => q.no); }

// note の商品（2026年下期のマガジン）。期が変わったら URL を差し替える（promo/field-books/update-rules.md）
function more() {
  const a = (href, name, sub) => el("a", { href, target: "_blank", rel: "noopener" }, name, el("span", {}, sub));
  return el("div", { class: "more" }, el("h2", {}, "もっと解くなら（note）"),
    a("https://note.com/gutti_car/m/m02d14a3b0035", "本試験形式の模擬試験", "35問×9回・自動採点のExcel"),
    a("https://note.com/gutti_car/m/m5c1a5e40256f", "分野別問題集", "法令・物理化学・性質消火の3冊"));
}

function home() {
  run = null;
  const all = stats();
  const wrong = wrongNos();
  const cards = subjects.map(s => {
    const st = stats(s.key);
    const exam = !isBook();
    const rate = st.rate == null ? el("span", { class: "rate" }, "—", el("small", {}, "未回答"))
      : el("span", { class: "rate " + (exam ? (st.rate >= LINE() ? "pass" : "fail") : "") }, st.rate + "%",
          exam ? el("small", {}, st.rate >= LINE() ? "合格ライン以上" : LINE() + "%未満") : null);
    const mine = qs.filter(q => q.subject_key === s.key).map(q => q.no);
    const wrongHere = mine.filter(n => saved[n] && !saved[n].ok);  // この科目（テーマ）で間違えた問題だけ（2026-11-14 オーナー指示）
    const card = el("button", { class: "subj", id: "subj-" + s.key, onclick: () => start(mine, s.short) },
      el("span", { class: "name" }, s.short),
      rate,
      el("span", { class: "meta" }, `${s.questions}問・回答済み ${st.done}・正解 ${st.ok}`),
      el("span", { class: "meter", "aria-hidden": "true" }, el("i", { style: `width:${st.rate ?? 0}%` }), exam ? el("b", { style: `left:${LINE()}%` }) : null));
    return el("div", { class: "subj-wrap" }, card,
      wrongHere.length ? el("button", { class: "mini", id: "wrong-" + s.key, onclick: () => start(wrongHere, s.short + "の間違えた問題") },
        `${s.short} の間違えた ${wrongHere.length}問だけ解く`) : null);
  });
  const unanswered = qs.filter(q => !saved[q.no]).map(q => q.no);
  app.replaceChildren(...[
    LIBRARY ? el("button", { class: "link", id: "to-library", onclick: library }, "← 問題集の一覧へ") : null,
    el("div", {}, el("span", { class: "sign" }, "危険物 乙種第4類")),
    el("h1", {}, DATA.title.split(/ (.+)/).filter(Boolean).flatMap((w, i) => i ? [el("br"), w] : [w]), `（${qs.length}問）`),
    el("p", { class: "lead" }, isBook()
      ? "テーマごとに10問ずつ。選択肢を選んで「回答する」で答え合わせ。選び直しもできます。苦手なテーマの正解率がひと目でわかります。"
      : "選択肢を選んで「回答する」で答え合わせ。選び直しもできます。科目ごとの正解率が残ります。" + ((DATA.rules && DATA.rules.note) || "本番の合格は 3科目それぞれ 60%以上です。")),
    el("div", { class: "subjects" }, cards),
    el("div", { class: "row" },
      el("button", { class: "btn primary", id: "start-all", onclick: () => start(qs.map(q => q.no), `${qs.length}問すべて`) }, `${qs.length}問すべて解く`),
      isBook() ? el("button", { class: "btn", id: "start-new", disabled: !unanswered.length || unanswered.length === qs.length,
        onclick: () => start(unanswered, "まだ解いていない問題") }, unanswered.length && unanswered.length < qs.length ? `続きから（未回答 ${unanswered.length}問）` : "未回答の問題はありません") : null,
      el("button", { class: "btn", id: "start-wrong", disabled: !wrong.length, onclick: () => start(wrong, "間違えた問題") },
        wrong.length ? `間違えた ${wrong.length}問だけ` : "間違えた問題はまだありません")),
    el("p", { class: "note" }, `全体：回答済み ${all.done} / ${all.total}・正解 ${all.ok}。記録はこのスマホの中だけに残ります。`),
    all.done ? el("button", { class: "link", id: "reset", onclick: resetAsk }, "記録を消す") : null,
    LIBRARY ? null : more()
  ].filter(Boolean));
  window.scrollTo(0, 0);
}

function resetAsk(ev) {
  const b = ev.currentTarget;
  if (b.dataset.armed) { saved = {}; persist(); home(); return; }
  b.dataset.armed = "1"; b.textContent = "もう一度押すと、すべての記録を消します";
}

function start(list, label) { run = { list, pos: 0, answered: {}, label }; question(); }

function question() {
  const q = qs[run.list[run.pos] - 1];
  const s = subjects.find(x => x.key === q.subject_key) || {};
  const total = run.list.length;
  // 選んだだけでは答え合わせしない。迷ったら選び直してから「回答する」（2026-11-14 オーナー指示）
  let pick = null;
  const submit = el("button", { class: "btn primary", id: "submit", disabled: true, onclick: () => answer(q, pick) }, "選択肢を選んでください");
  const choices = q.choices.map((c, i) => el("button", { class: "choice", id: `c${i + 1}`, "aria-pressed": "false", onclick: ev => {
      pick = i + 1;
      document.querySelectorAll(".choice").forEach(b => { b.classList.remove("selected"); b.setAttribute("aria-pressed", "false"); });
      ev.currentTarget.classList.add("selected"); ev.currentTarget.setAttribute("aria-pressed", "true");
      submit.disabled = false; submit.textContent = `${NUMS[i]} で回答する`;
    } },
    el("span", { class: "no" }, NUMS[i]), el("span", {}, c)));
  app.replaceChildren(
    el("div", { class: "top" }, el("button", { class: "link", id: "quit", onclick: home }, "← やめる"),
      el("span", { class: "count" }, `${run.pos + 1} / ${total}`)),
    el("div", { class: "progress", "aria-hidden": "true" }, el("i", { style: `width:${run.pos / total * 100}%` })),
    el("div", { class: "top" }, el("span", { class: "eyebrow" }, `問${q.no}`), el("span", { class: "tag" }, s.short || "")),
    el("p", { class: "question" }, q.question),
    el("div", { class: "choices", id: "choices" }, choices),
    el("div", { class: "submit", id: "submit-bar" }, submit)
  );
  window.scrollTo(0, 0);
}

function answer(q, pick) {
  const ok = pick === q.answer;
  run.answered[q.no] = pick;
  saved[q.no] = { ok, pick, at: Date.now() };
  persist();
  document.getElementById("submit-bar").remove();
  document.querySelectorAll(".choice").forEach((b, i) => {
    b.disabled = true; b.classList.remove("selected");
    if (i + 1 === q.answer) b.classList.add("correct");
    else if (i + 1 === pick) b.classList.add("wrong");
  });
  const last = run.pos === run.list.length - 1;
  const fb = el("div", { class: "feedback", id: "feedback" },
    el("div", { class: "verdict " + (ok ? "ok" : "ng") }, ok ? "○ 正解" : `× 不正解　正解は ${NUMS[q.answer - 1]}`),
    el("p", { class: "exp" }, q.explanation));
  const next = el("button", { class: "btn primary", id: "next", onclick: () => { if (last) result(); else { run.pos++; question(); } } },
    last ? "結果を見る" : "次の問題へ");
  app.append(fb, el("div", { class: "row" }, next));
  fb.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

// 合否の一言。rules.total（合計の合格ライン%）があるときは、配点（科目の pts ＝1問の点）で重みを付けた合計も見る
function verdict(rows, nos) {
  const sub = rows.every(r => r.querySelector(".pass"));
  const tl = DATA.rules && DATA.rules.total;
  let totalOk = true, tail = "";
  if (tl) {
    let got = 0, all = 0;
    subjects.forEach(s => {
      const w = s.pts || 1, mine = nos.filter(n => qs[n - 1].subject_key === s.key);
      all += mine.length * w; got += mine.filter(n => run.answered[n] === qs[n - 1].answer).length * w;
    });
    const pct = all ? Math.round(got / all * 100) : 0; totalOk = pct >= tl; tail = `（得点率 ${pct}%）`;
  }
  const L = LINE();
  if (sub && totalOk) return `どの科目も ${L}%以上${tl ? "、合計も " + tl + "%以上" : ""}です${tail}`;
  return [sub ? "" : `${L}%に届かない科目があります`, totalOk ? "" : `合計が ${tl}%に届いていません`].filter(Boolean).join("。") + tail;
}

function result() {
  const nos = Object.keys(run.answered).map(Number);
  const ok = nos.filter(n => run.answered[n] === qs[n - 1].answer).length;
  const rows = subjects.map(s => {
    const mine = nos.filter(n => qs[n - 1].subject_key === s.key);
    if (!mine.length) return null;
    const k = mine.filter(n => run.answered[n] === qs[n - 1].answer).length;
    const r = Math.round(k / mine.length * 100);
    const exam = !isBook() && nos.length >= qs.length;
    return el("div", { class: "subj" }, el("span", { class: "name" }, s.short),
      el("span", { class: "rate " + (exam ? (r >= LINE() ? "pass" : "fail") : "") }, r + "%",
        exam ? el("small", {}, r >= LINE() ? "合格ライン以上" : LINE() + "%未満") : null),
      el("span", { class: "meta" }, `${mine.length}問中 ${k}問正解`),
      el("span", { class: "meter", "aria-hidden": "true" }, el("i", { style: `width:${r}%` }), exam ? el("b", { style: `left:${LINE()}%` }) : null));
  }).filter(Boolean);
  const wrong = nos.filter(n => run.answered[n] !== qs[n - 1].answer);
  app.replaceChildren(
    el("div", { class: "result-head" }, el("span", { class: "eyebrow" }, run.label + "の結果"),
      el("span", { class: "big" }, `${ok} / ${nos.length}`),
      el("span", { class: "verdict-line" }, (isBook() || nos.length < qs.length) ? `正解率 ${nos.length ? Math.round(ok / nos.length * 100) : 0}%`
        : verdict(rows, nos))),
    el("div", { class: "subjects" }, rows),
    el("div", { class: "row" },
      wrong.length ? el("button", { class: "btn primary", id: "retry-wrong", onclick: () => start(wrong, "間違えた問題") }, `間違えた ${wrong.length}問を解き直す`) : null,
      el("button", { class: "btn", id: "home", onclick: home }, "最初の画面へ")),
    LIBRARY ? null : more()
  );
  window.scrollTo(0, 0);
}

// ---- 有料ライブラリ：商品ごとに合言葉で暗号化した問題データ（data/<id>.enc.json）を開く ----
// AES-256-GCM。鍵は合言葉から PBKDF2-SHA256（60万回）で作る。合言葉が違うと復号に失敗する（中身は読めない）。
const PBKDF2_ROUNDS = 600000;
const normPass = s => s.normalize("NFKC").trim();  // 全角で入れても半角になる。大文字・小文字は区別する
function toB64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode(...u8.subarray(i, i + 8192)); return btoa(s); }
function fromB64(t) { const s = atob(t); const u8 = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i); return u8; }
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(normPass(pass)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: PBKDF2_ROUNDS, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptJSON(obj, pass) {  // 作る側（build）だけが使う
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await deriveKey(pass, salt), new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, salt: toB64(salt), iv: toB64(iv), ct: toB64(new Uint8Array(ct)) };
}
async function decryptJSON(blob, pass) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(blob.iv) }, await deriveKey(pass, fromB64(blob.salt)), fromB64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const passKey = id => "otsu4-pass-" + id;
function getPass(id) { try { return localStorage.getItem(passKey(id)); } catch (e) { return null; } }
function setPass(id, p) { try { localStorage.setItem(passKey(id), p); } catch (e) {} }
function forgetPass(id) { try { localStorage.removeItem(passKey(id)); } catch (e) {} }

async function openProduct(item, pass) {
  const res = await fetch(`data/${item.id}.enc.json`);
  if (!res.ok) throw new Error("fetch");
  const data = await decryptJSON(await res.json(), pass);
  setPass(item.id, normPass(pass));
  LIBRARY = true; load(data, "otsu4-pro-" + item.id); home();
}

function library() {
  run = null; LIBRARY = true; delete document.documentElement.dataset.skin;
  const card = item => {
    const s = readSaved("otsu4-pro-" + item.id), done = Object.keys(s).length, ok = Object.values(s).filter(x => x.ok).length;
    const open = !!getPass(item.id);
    return el("button", { class: "subj", id: "item-" + item.id, onclick: () => onItem(item) },
      el("span", { class: "name" }, item.title),
      el("span", { class: "rate" }, open ? (done ? Math.round(ok / done * 100) + "%" : "—") : "🔒", el("small", {}, open ? (done ? "正解率" : "未回答") : "合言葉")),
      el("span", { class: "meta" }, `${item.count}問` + (open ? `・回答済み ${done}` : "")));
  };
  const groups = [...new Set(LIB.map(i => i.group))];
  app.replaceChildren(
    el("div", {}, el("span", { class: "sign" }, "危険物 乙種第4類")),
    el("h1", {}, "乙4 問題集"),
    el("p", { class: "lead" }, "note で買った問題集を、スマホで1問ずつ解けます。買った記事の有料部分にある合言葉を、最初に1回だけ入れてください。"),
    ...groups.flatMap(g => [el("h2", { class: "group" }, g), el("div", { class: "subjects" }, LIB.filter(i => i.group === g).map(card))]),
    el("p", { class: "note" }, "合言葉と記録は、このスマホの中だけに残ります。"));
  window.scrollTo(0, 0);
}

async function onItem(item) {
  const saved = getPass(item.id);
  if (saved) {
    try { await openProduct(item, saved); return; } catch (e) { forgetPass(item.id); }
  }
  askPass(item);
}

function askPass(item, msg) {
  const input = el("input", { id: "pass", type: "text", autocomplete: "off", autocapitalize: "none", autocorrect: "off",
    spellcheck: "false", placeholder: "合言葉（15文字）", "aria-label": "合言葉" });
  const err = el("p", { class: "err", id: "pass-err", role: "alert" }, msg || "");
  const go = el("button", { class: "btn primary", id: "pass-go", onclick: async () => {
    if (normPass(input.value).length !== 15) { err.textContent = "合言葉は15文字です。文字数を確かめてください。"; return; }
    go.disabled = true; err.textContent = "確認しています…";
    try { await openProduct(item, input.value); }
    catch (e) {
      go.disabled = false;
      err.textContent = e.message === "fetch" ? "問題を読み込めません。電波を確かめてください。" : "合言葉が違います。買った記事の有料部分を確かめてください。";
    }
  } }, "開く");
  input.addEventListener("keydown", ev => { if (ev.key === "Enter") go.click(); });
  app.replaceChildren(
    el("button", { class: "link", id: "back", onclick: library }, "← 一覧へ"),
    el("h1", {}, item.title),
    el("p", { class: "lead" }, "買った note の記事の有料部分に書いてある合言葉を入れてください。15文字で、大文字と小文字は区別されます。コピーして貼り付けると、打ち間違えません。"),
    input, err, el("div", { class: "row" }, go));
  input.focus();
}

if (INLINE) { load(INLINE, "otsu4-trial-v1"); home(); } else library();
</script>
